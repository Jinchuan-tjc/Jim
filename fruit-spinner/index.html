<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>水果转轴娱乐页</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#6b1aa0,#190026 60%,#050008);font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',Arial,sans-serif;color:white;text-align:center}.wrap{max-width:460px;margin:auto;padding:16px}h1{color:#ffd75a;text-shadow:0 0 12px #ffb000}.machine{border:3px solid #d7aa32;border-radius:28px;padding:16px;background:linear-gradient(#8a1bc1,#230033);box-shadow:0 0 28px rgba(255,210,50,.5)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:rgba(0,0,0,.28);border-radius:15px;padding:10px}.stat b{display:block;color:#ffe071;font-size:22px;margin-top:4px}.screen{margin:16px 0;padding:10px;border-radius:20px;background:#07000d;border:3px solid #e2b743}.reels{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.cell{height:60px;border-radius:14px;background:linear-gradient(#fff,#e7e7e7);display:flex;align-items:center;justify-content:center;font-size:36px;color:#111;box-shadow:inset 0 0 8px #555}.cell.win{outline:3px solid #00ffd5;box-shadow:0 0 15px #00ffd5,inset 0 0 8px #555}.spin .cell{filter:blur(1px)}.msg{min-height:36px;font-size:18px;font-weight:800;color:#00ffd5}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center}.betbox{background:rgba(255,255,255,.12);border-radius:16px;padding:10px}input{width:90px;text-align:center;border:0;border-radius:12px;padding:9px;font-size:18px}button{border:0;border-radius:16px;padding:13px 10px;font-size:18px;font-weight:900;background:linear-gradient(#fff06f,#ffb300);color:#2b1700;box-shadow:0 5px 0 #9b6500}button:active{transform:translateY(3px);box-shadow:0 2px 0 #9b6500}.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}.small{font-size:14px;background:rgba(255,255,255,.18);color:white;box-shadow:none;border:1px solid rgba(255,255,255,.25)}.pay{text-align:left;font-size:12px;line-height:1.7;margin-top:12px;background:rgba(0,0,0,.25);border-radius:16px;padding:12px}.note{font-size:11px;opacity:.65;line-height:1.6;margin-top:12px}</style></head><body><div class="wrap"><h1>🎰 水果转轴机</h1><div class="machine"><div class="stats"><div class="stat">积分<b id="score">999999</b></div><div class="stat">本局奖励<b id="win">0</b></div></div><div class="screen"><div class="reels" id="reels"></div></div><div class="msg" id="msg">先点“开启音效”，再按旋转</div><div class="controls"><div class="betbox">单线积分<br><input id="bet" value="5" inputmode="numeric"></div><button id="spin">旋转</button></div><div class="row"><button class="small" id="minus">-5</button><button class="small" id="auto">自动10次</button><button class="small" id="sound">开启音效</button></div><div class="row"><button class="small" id="reset">重置</button><button class="small" id="plus">+5</button><button class="small" id="max">最大</button></div><div class="pay">玩法：5轴3行，20条线。左到右连续3个以上相同图标获得积分奖励。高等级图标更稀有，奖励更高，整体是高波动娱乐体验。</div></div><div class="note">单机娱乐模拟，无充值、无提现、无真钱交易。iPhone 需要先点“开启音效”解锁声音。</div></div><script>(()=>{let score=999999,spinning=false,auto=0,sound=false,ctx=null;const sy=[['🍒',28,[0,2,8,25]],['🍋',24,[0,3,10,30]],['🍉',18,[0,4,15,45]],['🔔',13,[0,6,25,80]],['👑',9,[0,10,60,250]],['7️⃣',6,[0,20,120,500]],['💎',3,[0,40,250,1000]]];const lines=[[5,6,7,8,9],[0,1,2,3,4],[10,11,12,13,14],[0,6,12,8,4],[10,6,2,8,14],[0,1,7,13,14],[10,11,7,3,4],[5,1,2,3,9],[5,11,12,13,9],[0,6,7,8,4],[10,6,7,8,14],[5,6,2,8,9],[5,6,12,8,9],[0,6,2,8,4],[10,6,12,8,14],[0,6,7,13,9],[10,6,7,3,4],[5,1,7,13,9],[5,11,7,3,9],[0,6,12,13,14]];const $=id=>document.getElementById(id);const fmt=n=>Math.floor(n).toLocaleString('zh-CN');function unlock(){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();sound=true;$('sound').textContent='音效已开';$('msg').textContent='音效已开启，按下旋转开始';tone(660,.08,.04)}catch(e){$('msg').textContent='当前浏览器不支持音效'}}function tone(f,d,v){if(!sound||!ctx)return;let o=ctx.createOscillator(),g=ctx.createGain();o.type='square';o.frequency.value=f;g.gain.value=v||.03;o.connect(g);g.connect(ctx.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+d);setTimeout(()=>{try{o.stop()}catch(e){}},d*1000+40)}function rollSound(){tone(220,.04,.018)}function winSound(big){if(big){[440,660,880,1320].forEach((f,i)=>setTimeout(()=>tone(f,.16,.045),i*120))}else{[520,720].forEach((f,i)=>setTimeout(()=>tone(f,.12,.035),i*100))}}function loseSound(){tone(130,.12,.025)}function rnd(){let t=sy.reduce((a,b)=>a+b[1],0),r=Math.random()*t;for(const x of sy){r-=x[1];if(r<=0)return x[0]}return'🍒'}function grid(){return Array.from({length:15},rnd)}function render(a,w=[]){$('reels').innerHTML=a.map((x,i)=>`<div class="cell ${w.includes(i)?'win':''}">${x}</div>`).join('')}function payOf(s){return (sy.find(x=>x[0]===s)||sy[0])[2]}function calc(a,b){let total=0,idx=[],hit=0;for(const line of lines){let f=a[line[0]],c=1;for(let i=1;i<5;i++){if(a[line[i]]===f)c++;else break}if(c>=3){let m=payOf(f)[c-2]||0;if(m){total+=b*m;hit++;for(let k=0;k<c;k++)if(!idx.includes(line[k]))idx.push(line[k])}}}return{total:Math.floor(total),idx,hit}}function spin(){if(spinning)return;if(!sound)unlock();let lb=parseInt($('bet').value)||1;lb=Math.max(1,Math.min(500,lb));$('bet').value=lb;let cost=lb*20;score-=cost;$('score').textContent=fmt(score);$('win').textContent=0;$('msg').textContent='转轴旋转中';$('spin').textContent='旋转中';spinning=true;$('reels').className='reels spin';let n=0,t=setInterval(()=>{render(grid());rollSound();if(++n>18){clearInterval(t);let a=grid(),r=calc(a,lb);score+=r.total;render(a,r.idx);$('reels').className='reels';$('score').textContent=fmt(score);$('win').textContent=fmt(r.total);$('msg').textContent=r.total?`命中 ${r.hit} 条线，获得 ${fmt(r.total)} 积分`:'未命中，再来一次';r.total?winSound(r.total>=cost*20):loseSound();$('spin').textContent='旋转';spinning=false;if(auto>0){auto--;$('auto').textContent='自动'+auto+'次';setTimeout(spin,350)}else $('auto').textContent='自动10次'}},55)}$('sound').onclick=unlock;$('spin').onclick=spin;$('minus').onclick=()=>{$('bet').value=Math.max(1,(parseInt($('bet').value)||5)-5)};$('plus').onclick=()=>{$('bet').value=Math.min(500,(parseInt($('bet').value)||5)+5)};$('max').onclick=()=>{$('bet').value=500};$('reset').onclick=()=>{score=999999;auto=0;$('score').textContent=fmt(score);$('win').textContent=0;$('msg').textContent='已重置';$('auto').textContent='自动10次';render(Array(15).fill('❔'))};$('auto').onclick=()=>{if(auto){auto=0;$('auto').textContent='自动10次'}else{auto=10;spin()}};render(Array(15).fill('❔'))})();</script></body></html>
